<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEP Agent</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>MEP Agent</h1>
            <p>Field Report Assistant</p>
        </header>

        <main>
            <form id="reportForm">
                <div class="form-group">
                    <label for="image">Capture/Upload Image</label>
                    <input type="file" id="image" name="image" accept="image/*" required>
                    <div id="image-preview" class="preview-box"></div>
                </div>

                <div class="form-group">
                    <label for="audio">Voice Note</label>
                    <input type="file" id="audio" name="audio" accept="audio/*" capture="microphone" required>
                    <div id="audio-preview" class="preview-box"></div>
                </div>

                <div class="form-group">
                    <label for="email">Recipient Email</label>
                    <input type="email" id="email" name="email" placeholder="supervisor@example.com" required>
                </div>
                
                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" name="subject" value="MEP Field Report" required>
                </div>

                <button type="submit" id="submitBtn">Process & Send</button>
            </form>

            <div id="status" class="status-container hidden">
                <div class="loader"></div>
                <p id="status-text">Processing...</p>
            </div>

            <div id="result" class="result-container hidden">
                <h3>Success!</h3>
                <p>Report sent successfully.</p>
                <div class="transcript-box">
                    <h4>Transcription:</h4>
                    <p id="transcript-text"></p>
                </div>
                <button id="resetBtn" class="secondary-btn">New Report</button>
            </div>
        </main>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
